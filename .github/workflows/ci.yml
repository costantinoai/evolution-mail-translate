name: CI

on:
  push:
    branches: ['**']
    tags-ignore: ['**']
  pull_request:
  workflow_call:

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build and private GUI test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config libglib2.0-dev libjson-glib-dev \
            evolution evolution-dev evolution-data-server-dev libebook1.2-dev \
            python3-venv xvfb dbus-x11 debhelper devscripts lintian chrpath
          sudo install -d -m 700 -o "$(id -u)" -g "$(id -g)" "/run/user/$(id -u)"
      - name: Create test environment
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install pytest ruff==0.15.1 -r requirements-online.txt
      - name: Check every shell script and Python source
        run: |
          for script in scripts/*.sh; do bash -n "$script"; done
          .venv/bin/ruff check tools/translate tests
      - name: Configure and build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DCMAKE_INSTALL_PREFIX=/usr -DCMAKE_C_FLAGS="-Wall -Wextra -Werror"
          cmake --build build -j2
      - name: Run regressions
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: .venv/bin/python -m pytest -q -p no:cacheprovider tests
      - name: Build isolated Debian package and enforce package checks
        run: ./scripts/build-deb.sh
