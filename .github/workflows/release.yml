name: Release
# Modified by Andrea Costantino on 2026-11-24: declare libxml2 and source prefix.

on:
  push:
    tags:
      - 'v[0-9]*.[0-9]*'         # v1.0, v2.1
      - 'v[0-9]*.[0-9]*.[0-9]*'  # v1.0.0, v2.1.3
  workflow_dispatch:

jobs:
  validate:
    uses: ./.github/workflows/ci.yml

  build-and-release:
    needs: validate
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check release version
        run: |
          VERSION=$(dpkg-parsechangelog -S Version)
          test "${GITHUB_REF_NAME}" = "v${VERSION%-*}"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config libglib2.0-dev libjson-glib-dev libxml2-dev \
            evolution evolution-dev evolution-data-server-dev libebook1.2-dev \
            debhelper devscripts lintian xz-utils chrpath

      - name: Build Debian package
        run: dpkg-buildpackage -us -uc -b

      - name: Build source tarball
        id: dist
        run: |
          set -e
          cmake -S . -B build-dist -DVERSION="$(dpkg-parsechangelog -S Version)"
          cmake --build build-dist --target dist
          TAR=$(ls -t build-dist/*.tar.xz | head -n1)
          echo "tar=$TAR" >> $GITHUB_OUTPUT

      - name: Gather artifacts and metadata
        id: gather
        run: |
          set -e
          DEB=$(ls -t ../*.deb | head -n1)
          echo "deb=$DEB" >> $GITHUB_OUTPUT
          echo "deb_name=$(basename "$DEB")" >> $GITHUB_OUTPUT
          TAR="${{ steps.dist.outputs.tar }}"
          echo "tar_name=$(basename "$TAR")" >> $GITHUB_OUTPUT

          # Generate SHA256 checksums
          (cd "$(dirname "$DEB")"; sha256sum "$(basename "$DEB")") > "${DEB}.sha256"
          (cd "$(dirname "$TAR")"; sha256sum "$(basename "$TAR")") > "${TAR}.sha256"
          echo "deb_sha=${DEB}.sha256" >> $GITHUB_OUTPUT
          echo "tar_sha=${{ steps.dist.outputs.tar }}.sha256" >> $GITHUB_OUTPUT

          # Extract metadata
          ARCH=$(dpkg --print-architecture)
          echo "arch=$ARCH" >> $GITHUB_OUTPUT
          VER=$(dpkg-parsechangelog -S Version)
          echo "version=$VER" >> $GITHUB_OUTPUT

      - name: Validate package quality
        run: lintian --display-info --fail-on error "${{ steps.gather.outputs.deb }}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: evolution-translate-extension ${{ steps.gather.outputs.version }} (${{ steps.gather.outputs.arch }})
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: |
            ${{ steps.gather.outputs.deb }}
            ${{ steps.gather.outputs.deb_sha }}
            ${{ steps.dist.outputs.tar }}
            ${{ steps.gather.outputs.tar_sha }}
          body: |
            ## Evolution Translation Extension ${{ steps.gather.outputs.version }}

            See the [changelog](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/docs/CHANGELOG.md) for the changes in this release.

            Argos processes text locally. Online providers receive message body text; choose the provider in Translate Settings.

            ### Installation

            **Ubuntu 24.04:**
            ```bash
            wget https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/${{ steps.gather.outputs.deb_name }}
            sudo apt install ./${{ steps.gather.outputs.deb_name }}
            evolution-translate-setup
            ```

            **From source:**
            ```bash
            wget https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/${{ steps.gather.outputs.tar_name }}
            tar -xf ${{ steps.gather.outputs.tar_name }}
            cd evolution-translate-extension-*/
            cmake -S . -B build -DCMAKE_INSTALL_PREFIX=/usr
            cmake --build build
            sudo cmake --install build
            evolution-translate-setup
            ```

            ### Verification

            SHA256 checksums are provided for both packages.

            ### Documentation

            - [User Guide](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/docs/USER_GUIDE.md)
            - [Developer Guide](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/docs/DEVELOPER_GUIDE.md)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
